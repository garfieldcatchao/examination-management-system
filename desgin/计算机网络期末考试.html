<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算机网络期末考试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      background: #f0f2f5;
      color: #333;
      line-height: 1.6;
    }
    .exam-container {
      max-width: 1200px;
      margin: 20px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    /* 顶部状态栏 */
    .header {
      background: linear-gradient(135deg, #3498db, #2c3e50);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer {
      font-weight: bold;
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 20px;
    }
    /* 主内容区 */
    .main-content {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 120px);
    }
    /* 左侧信息面板 */
    .sidebar {
      border-right: 1px solid #e0e0e0;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
    }
    .info-panel, .navigator {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .info-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: #555;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
    /* 题目导航器 */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .question-btn {
      aspect-ratio: 1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .question-btn.answered {
      background: #27ae60;
      color: white;
    }
    .question-btn.marked {
      background: #f39c12;
      color: white;
    }
    .question-btn.unanswered {
      background: #e0e0e0;
      color: #333;
    }
    .question-btn:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      font-size: 0.9rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* 题目区域 */
    .question-area {
      padding: 24px;
      overflow-y: auto;
    }
    .question-header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .question-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .question-meta {
      color: #666;
      font-size: 0.95rem;
    }
    .question-content {
      margin-bottom: 24px;
    }
    .options {
      margin: 20px 0;
    }
    .option {
      margin: 12px 0;
      padding: 10px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option:hover {
      background: #f0f8ff;
      border-color: #3498db;
    }
    .option.selected {
      background: #e6f7ff;
      border-color: #1890ff;
      border-width: 2px;
    }
    input[type="radio"] {
      margin-right: 10px;
    }
    /* 底部操作栏 */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #27ae60;
      color: white;
    }
    .btn-primary:hover {
      background: #219653;
    }
    .btn-secondary {
      background: #f1f1f1;
      color: #333;
    }
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    .btn-warning {
      background: #f39c12;
      color: white;
    }
    .btn-warning:hover {
      background: #d35400;
    }
    /* 提示信息 */
    .tips {
      margin-top: 24px;
      padding: 12px;
      background: #e8f4fd;
      border-left: 4px solid #3498db;
      font-size: 0.95rem;
    }
    .tip-item {
      margin: 6px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .tip-item::before {
      content: "•";
      color: #3498db;
    }
    /* 响应式设计 */
    @media (max-width: 768px) {
      .main-content {
        grid-template-columns: 1fr;
        height: auto;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid #e0e0e0;
      }
      .question-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="exam-container">
    <!-- 顶部状态栏 -->
    <div class="header">
      <h1>计算机网络期末考试</h1>
      <div class="timer">⏰ 剩余时间: 01:45:32</div>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
      <!-- 左侧面板 -->
      <div class="sidebar">
        <!-- 考试信息 -->
        <div class="info-panel">
          <div class="info-title">ℹ️ 考试信息</div>
          <div class="info-row">
            <span>总题数:</span>
            <span>24题</span>
          </div>
          <div class="info-row">
            <span>已答题:</span>
            <span class="answered-count">8题</span>
          </div>
          <div class="info-row">
            <span>未答题:</span>
            <span class="unanswered-count">16题</span>
          </div>
          <div class="info-row">
            <span>总分:</span>
            <span>100分</span>
          </div>
        </div>
        
        <!-- 题目导航 -->
        <div class="navigator">
          <div class="info-title">🧭 题目导航</div>
          <div class="question-grid">
            <!-- 示例按钮，实际应动态生成 -->
            <button class="question-btn answered">1</button>
            <button class="question-btn answered">2</button>
            <button class="question-btn marked">3</button>
            <button class="question-btn answered">4</button>
            <button class="question-btn answered">5</button>
            <button class="question-btn unanswered">6</button>
            <button class="question-btn answered">7</button>
            <button class="question-btn marked">8</button>
            <button class="question-btn answered">9</button>
            <button class="question-btn unanswered">10</button>
            <!-- 更多题目按钮... -->
          </div>
          <div class="legend">
            <div class="legend-item">
              <span class="question-btn answered" style="width: 20px; height: 20px; cursor: default;"></span>
              <span>已答</span>
            </div>
            <div class="legend-item">
              <span class="question-btn marked" style="width: 20px; height: 20px; cursor: default;"></span>
              <span>有疑问</span>
            </div>
            <div class="legend-item">
              <span class="question-btn unanswered" style="width: 20px; height: 20px; cursor: default;"></span>
              <span>未答</span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 题目区域 -->
      <div class="question-area">
        <div class="question-header">
          <div class="question-title">第6题 (单选题 2分)</div>
          <div class="question-meta">在TCP/IP协议族中，负责端到端可靠传输的协议是？</div>
        </div>
        
        <div class="question-content">
          <!-- 题目描述 -->
        </div>
        
        <div class="options">
          <div class="option">
            <label>
              <input type="radio" name="option" value="A">
              <span>A. IP协议</span>
            </label>
          </div>
          <div class="option selected">
            <label>
              <input type="radio" name="option" value="B" checked>
              <span>B. TCP协议</span>
            </label>
          </div>
          <div class="option">
            <label>
              <input type="radio" name="option" value="C">
              <span>C. UDP协议</span>
            </label>
          </div>
          <div class="option">
            <label>
              <input type="radio" name="option" value="D">
              <span>D. HTTP协议</span>
            </label>
          </div>
        </div>
        
        <div class="action-bar">
          <button class="btn btn-secondary">⬅️ 上一题</button>
          <button class="btn btn-secondary">下一题 ➡️</button>
          <button class="btn btn-primary">💾 保存答案</button>
          <button class="btn btn-warning">❓ 标记疑问</button>
        </div>
        
        <div class="tips">
          <div class="tip-item">• 点击题号快速跳转</div>
          <div class="tip-item">• 绿色表示已答题</div>
          <div class="tip-item">• 橙色表示有疑问</div>
          <div class="tip-item">• 答案
